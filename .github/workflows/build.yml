name: Sync Portfolio Data & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 00:00 UTC — keeps LeetCode stats, GitHub repos, and project badges fresh
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.6.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GitHub repos, LeetCode stats & project badges
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm run sync:data

      - name: Verify Resume PDF Asset
        run: |
          test -f public/sagar-resume.pdf || { echo "Resume file public/sagar-resume.pdf missing"; exit 1; }

      - name: Run Linter & Build
        run: |
          pnpm run lint || true
          pnpm run build

      - name: Upload Resume as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sagar-resume
          path: public/sagar-resume.pdf
          if-no-files-found: error

      - name: Commit & Push updated portfolio data
        # Commit on main after push, schedule, or manual dispatch — skipped on PRs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated/portfolio-data.json
          if git diff --staged --quiet; then
            echo "No portfolio data changes to commit."
          else
            git commit -m "chore(data): sync GitHub repos, LeetCode stats & project badges [skip ci]"
            git push origin main
          fi
